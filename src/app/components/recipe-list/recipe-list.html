<div class="list-container">
  <h2>Minhas Receitas</h2>

  <!-- Event binding: (input) chama onSearch -->
  <div class="search-box">
    <label for="search">Buscar receita:</label>
    <input
      id="search"
      type="text"
      [value]="searchTerm()"
      (input)="onSearch($event)"
      placeholder="Digite para filtrar..."
    />
  </div>

  <app-recipe-form (onRecipeAdded)="onRecipeAdded()" />

  <div class="recipes-grid">
    @if (filteredRecipes().length === 0) {
      <p class="empty">Nenhuma receita encontrada.</p>
    } @else {
      @for (recipe of filteredRecipes(); track recipe.id) {
        <!-- Property binding: [recipe] passa dados para o filho -->
        <!-- Event binding: (remove) escuta evento emitido pelo filho -->
        <app-recipe-card
          [recipe]="recipe"
          (remove)="onRecipeRemoved(recipe.id)"
        ></app-recipe-card>
      }
    }
  </div>
</div>
