<div class="form-card">
  <h2>+ Nova Receita</h2>

  <form (submit)="addRecipe()" class="recipe-form">
    <div class="form-group">
      <label>Título</label>
      <!-- Two-way binding com [(ngModel)] -->
      <input
        type="text"
        name="title"
        [(ngModel)]="newRecipe.title"
        placeholder="Ex: Bolo de Chocolate"
      />
    </div>

    <div class="form-group">
      <label>Descrição</label>
      <input
        type="text"
        name="description"
        [(ngModel)]="newRecipe.description"
        placeholder="Ex: Delicioso bolo caseiro"
      />
    </div>

    <div class="form-group">
      <label>Ingredientes (separados por vírgula)</label>
      <input
        type="text"
        name="ingredients"
        [(ngModel)]="ingredientsInput"
        placeholder="Ex: farinha, açúcar, ovos"
      />
    </div>

    <div class="form-group">
      <label>Instruções</label>
      <textarea
        name="instructions"
        [(ngModel)]="newRecipe.instructions"
        rows="4"
        placeholder="Modo de preparo..."
      ></textarea>
    </div>

    <div class="form-group">
      <label>URL da Imagem</label>
      <input
        type="url"
        name="image"
        [(ngModel)]="newRecipe.image"
        placeholder="https://..."
      />
    </div>

    <button type="submit" class="btn-save">Salvar Receita</button>
  </form>

  <div class="preview">
    <h4>Pré-visualização:</h4>
    <p>Título: {{ newRecipe.title }}</p>
    <p>Descrição: {{ newRecipe.description }}</p>
  </div>
</div>
